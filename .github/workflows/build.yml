name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - run: ./gradlew build -PmcVariant=26
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
