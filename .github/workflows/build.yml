name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      # Compile the Paper side against the newest Paper API as well.
      - run: ./gradlew compileJava -PcheckApi=26.3.build.249-stable
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
