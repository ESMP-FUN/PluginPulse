name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      # The 26.x companion reads the Paper 26 API, which needs JDK 25 to compile against.
      - name: Build the 26.x companion
        run: ./gradlew :pluginpulse-companion:shadowJar -PmcVariant=26
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - name: Extract changelog section
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md" > RELEASE_NOTES.md

      - name: Create release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "pluginpulse-companion/build/libs/pluginpulse-companion-$VERSION.jar" \
            "pluginpulse-companion/build/libs/pluginpulse-companion-$VERSION-mc26.jar" \
            --title "PluginPulse-$VERSION" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
