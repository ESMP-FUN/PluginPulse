name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Extract changelog section
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md" > RELEASE_NOTES.md

      # One Paper jar for every Minecraft version, and the Velocity jar. Servers still
      # on an old -mc26 companion find no tag ending in -mc26 on GitHub, so they are
      # offered the newest release, this one.
      - name: Create release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "pluginpulse-companion/build/libs/pluginpulse-companion-$VERSION.jar" \
            "pluginpulse-companion-velocity/build/libs/pluginpulse-companion-velocity-$VERSION.jar" \
            --title "PluginPulse-$VERSION" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}

      # Add new Minecraft versions to MC_VERSIONS.
      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: QWp6GQZS
          LOADERS: paper purpur folia spigot bukkit
          MC_VERSIONS: 1.20.5 1.20.6 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 26.1 26.1.1 26.1.2 26.2 26.3
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *alpha*) TYPE=alpha ;;
            *beta*|*rc*) TYPE=beta ;;
            *) TYPE=release ;;
          esac
          upload() {
            python3 - "$1" "$2" "$3" > data.json <<'PY'
          import json, os, sys
          print(json.dumps({
              "project_id": os.environ["PROJECT_ID"],
              "version_number": sys.argv[1],
              "name": sys.argv[2],
              "version_type": os.environ["TYPE"],
              "changelog": open("RELEASE_NOTES.md").read(),
              "loaders": sys.argv[3].split(),
              "game_versions": os.environ["MC_VERSIONS"].split(),
              "dependencies": [],
              "featured": True,
              "status": "listed",
              "file_parts": ["jar"],
              "primary_file": "jar",
          }))
          PY
            curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: ESMP-FUN/PluginPulse release workflow" \
              -F "data=<data.json;type=application/json" \
              -F "jar=@$4;type=application/java-archive"
          }
          export TYPE
          upload "$VERSION" "PluginPulse $VERSION" "$LOADERS" "pluginpulse-companion/build/libs/pluginpulse-companion-$VERSION.jar"
          # The Velocity jar keeps its own "-velocity" version, which the update check looks for.
          upload "$VERSION-velocity" "PluginPulse $VERSION-velocity" "velocity" "pluginpulse-companion-velocity/build/libs/pluginpulse-companion-velocity-$VERSION.jar"
